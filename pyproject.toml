[build-system]
requires = ["uv_build>=0.8.3,<0.13"]
build-backend = "uv_build"

[project]
name = "pyocmf"
version = "0.6.0"
description = "Python library for parsing and verifying OCMF (Open Charge Metering Format) signatures from electric vehicle charging stations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Paul Wullenweber", email = "44506902+paul-ww@users.noreply.github.com" }
]
keywords = ["ocmf", "ev", "charging", "metering", "electric-vehicle", "signature-verification", "eichrecht"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "defusedxml>=0.7.1",
    "phonenumbers>=9.0",
    "pydantic-extra-types>=2.10",
    "pydantic>=2.10",
]

[project.urls]
Homepage = "https://github.com/paul-ww/pyocmf"
Documentation = "https://paul-ww.github.io/pyocmf/"
Repository = "https://github.com/paul-ww/pyocmf"
Issues = "https://github.com/paul-ww/pyocmf/issues"

[project.scripts]
ocmf = "pyocmf.cli:main"

[project.optional-dependencies]
cli = [
    "rich>=14.0",
    "typer>=0.20",
]
crypto = [
    "cryptography>=44",
    "ecdsa>=0.19",
]
all = [
    "pyocmf[cli,crypto]",
]

[dependency-groups]
cli = [
    "rich>=14.0",
    "typer>=0.20",
]
crypto = [
    "cryptography>=44",
    "ecdsa>=0.19",
]
test = [
    "pytest>=9.0",
]
lint = [
    "ruff>=0.8",
    "ty>=0.0",
    "types-cryptography>=3.3",
]
docs = [
    # MkDocs 2.0 drops plugins and themes; Material 9.7.0-9.7.4 do not cap it
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-autorefs>=1.2",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "docs"},
    "poethepoet>=0.32",
    "prek>=0.4",
]

[tool.uv]
default-groups = "all"

[tool.ty.rules]
# Opt-in rule: bare generics like `dict` hide what a value holds
missing-type-argument = "error"

[tool.poe.tasks]
test = "pytest test -x"
lint = "ruff check src test"
lint-fix = "ruff check --fix src test"
format = "ruff format src test"
format-check = "ruff format --check src test"
typecheck = "ty check src test"
docs = "mkdocs build --strict"
demo-wheel = {shell="rm -rf docs/demo/wheels && uv build --wheel --out-dir docs/demo/wheels && printf '{\"wheel\": \"%s\", \"commit\": \"%s\"}\\n' \"$(basename docs/demo/wheels/*.whl)\" \"$(git rev-parse --short HEAD)\" > docs/demo/wheels/latest.json", help="Build the pyocmf wheel the browser demo installs"}
demo = {shell="poe demo-wheel && mkdocs serve", help="Serve the docs and browser demo locally with the current code"}
pre-commit = "prek run --all-files"
